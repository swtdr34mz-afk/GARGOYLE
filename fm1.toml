# GARGOYLE build settings (fm1-base tools/build.py). The pixel type of the platform's own screens: X0X_FONTSET=terminus in
# the environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host).
# The engraved serif faces are GARGOYLE's own (ui_serif.h, from tools/gen_serif.py).
name = "gargoyle"                 # the build's file names: gargoyle-0.1.fwsc, build/host/gargoyle_host
title = "GARGOYLE"                # the name people see (firmware hubs)
id_prefix = "FM-1_594"            # package identity: dev FM-1_59400, releases FM-1_594 + XXYYZZ (FIKH-S 593, BA-55 592)
usb_manufacturer = "swtdr34mz"
usb_product = "GARGOYLE FM-1"     # the USB name (the MIDI port in a DAW)
o2 = ["dsp/fikh_core.c"]          # the sound core (FIKH-S) and the GROOVE, at -O2 (one translation unit)
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
tagline = "A live drone synth: the sound of FIKH-S under four macros, 22 rooms, a GROOVE of dungeon noises (heartbeat, footsteps, chains, bells)"
repo = "https://github.com/swtdr34mz-afk/GARGOYLE"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments). Liberation Serif (SIL OFL 1.1)."
author = "swtdr34mz"
description = "A drone synth made for playing live. The 22 algorithms of FIKH-S are 22 rooms of a dungeon, and four macros do the same in every room: TONE (dark to bright), MOVE (still to churning), GRIT (clean to broken), SPACE (dry to endless), each with a sweetspot in the middle. A GROOVE of dungeon noises instead of drums (heartbeat, footsteps, drips, chains, wings, ritual, bell, bones, rumble, torch), tuned to the drone, with a soft pump that makes the drone breathe. HOLD, FREEZE, DICE, 8 snapshots, MIDI clock."
tags = ["synth", "ambient", "experimental"]
install = "https://github.com/swtdr34mz-afk/GARGOYLE/releases"
screenshot = "site/img/screen-main.png"
